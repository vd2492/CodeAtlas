name: Update traffic badge

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-traffic-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for traffic analytics token
        id: traffic-token
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -n "$TRAFFIC_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README traffic badge
        if: steps.traffic-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/update_repo_traffic_badge.py --repo "$GITHUB_REPOSITORY"

      - name: Skip traffic badge update without analytics token
        if: steps.traffic-token.outputs.available == 'false'
        run: echo "::notice::Traffic badge update skipped. Add a fine-grained TRAFFIC_TOKEN secret with read-only Administration permission to enable it."

      - name: Commit README update
        run: |
          if git diff --quiet README.md; then
            echo "Traffic badge is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo traffic badge"
          git push
