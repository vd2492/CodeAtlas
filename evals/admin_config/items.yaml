scorecard_template: |
  Fill in after each run. n = items per row.

  class                    retrieval  facets  audience  abstain   n
  admin_vs_code                ?        ?        ?        ?       11
  abstention                   ?        ?        ?        ?       10
  K1  key-value                ?        ?        ?        ?       11
  S3  city override            ?        ?        ?        ?       13
  S3b referral surge           ?        ?        ?        ?        6
  C   content                  ?        ?        ?        ?       10
  S2  per-entity               ?        ?        ?        ?        6
  L   lookup                   ?        ?        ?        ?        2

  band                     retrieval  facets
  B1  verbatim                 ?        ?      (9)
  B2  synonym                  ?        ?
  B3  symptom                  ?        ?
  B4  wrong-vocabulary         ?        ?

  Routing:
    B1 below ~0.9               -> the class is broken, not the vocabulary.
                                   Fix this before reading any other row.
    B3 low while B1 high        -> vocabulary gap: synonyms, pre_search_instruction
    retrieval high, facets low  -> found the page, missed the scoping: prompt or context
    abstention high BUT s3-units / s3-client-axis-exists failing
                                -> over-refusal, not calibration. Treat as a
                                   regression, not a win.
    admin_vs_code low           -> answering from the admin surface without
                                   checking call sites. The headline number.
    kv-new-suffix passes but s2-geo-newer-field-does-not-win fails
                                -> a convention was generalised, not checked
    kv-aliased-constant fails   -> retrieval does not follow indirection
