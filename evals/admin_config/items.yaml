# =================================================================
# abstention
#     The correct answer is "this is not determinable here". Each one is
#     verified absent or undocumented, not merely obscure.
#
#     A bare "I don't know" is NOT a pass. Every item requires the
#     constructive half too - naming where the answer actually lives, or
#     who to ask. Otherwise the metric rewards unhelpful non-answers, and
#     you optimise straight into a system that refuses everything.
#     Read this class against s3-units and s3-client-axis-exists, which
#     punish exactly that over-refusal.
# =================================================================

- id: abs-notice-display-filter
  status: grounded
  scope_class: C
  kind: abstention
  band: B2
  question: "What do I put in the display filter field on a rider notice?"
  expect:
    verdict: not_determinable_from_admin
    must_say: the field is free text with no documented format on the form
    should_say: the expected structure has to come from the code or engineering
    must_not: invent a schema or example value
  notes: >-
    Verified: rider notices carry no help_text on any field. Contrast
    referral surge config, the one model here that documents its fields.
  evidence_paths: ["**/rider_app/**"]

- id: abs-config-value-format
  status: grounded
  scope_class: K1
  kind: abstention
  band: B3
