  gold_citations: ["rider_app/models.py:43-44", "common/widgets.py:12-45"]
  notes: >-
    CORRECTED. The first draft asserted no image field existed - the HTML
    scrape missed it because the URL input is hidden behind a JS upload
    widget. That wrong gold would have penalised correct answers.
  evidence_paths: ["**/rider_app/models.py", "**/common/widgets.py"]

- id: c-carousel-active-flags
