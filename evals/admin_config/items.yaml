      - only the Configs copy is read; the other is dead
  gold_citations: ["RMS/views.py:566"]
  sibling_cases:
    chain_slot_config: rider_app.configparams (slot/tasks.py:414)
    selfie_fraud_detection_config: RMS.config (rider_app/views.py:2329)
  notes: >-
    Three keys collide across the two tables and they do NOT all resolve to
    the same table, so a rule learned from one transfers wrongly to another.
  evidence_paths: ["**/RMS/views.py", "**/slot/tasks.py", "**/rider_app/views.py"]

- id: kv-new-suffix
  status: grounded
  scope_class: K1
  band: B2
  priority: high
  question: "I need to update the OCR auto-activation settings. Which entry do I edit?"
  expect:
    answer: the _new suffixed keys are live, the un-suffixed twins are abandoned
    live: [ocr_auto_activation_configs_new, ocr_auto_activation_config_profile_section_new]
    dead: [auto_activation_config, auto_activation_config_profile_section]
    must_mention: the un-suffixed twin has no code references
    should_mention: >-
      the suffix means "newer than its twin", not "guaranteed live" - some
      _new keys are themselves unreferenced
  gold_citations:
    - rider_app/viewset/document_verification_helper.py:122
    - rider_app/serializers.py:1400-1401
  evidence_paths: ["**/rider_app/viewset/document_verification_helper.py", "**/rider_app/serializers.py"]

- id: kv-aliased-constant-indirection
  status: grounded
  scope_class: K1
  band: B3
  priority: high
  question: "Where is the list of websites riders are allowed to open from the app?"
  expect:
    answer: >-
      the whitelisting_websites_external_link_new config key, referenced
      through a named constant rather than by its literal string
    must_mention: the key is reached via a constant, so the name does not appear inline
  retrieval_difficulty: >-
    a literal grep for the key name misses every call site. Requires following
    the constant definition. Four keys are aliased this way.
  gold_citations: ["common/redis_keys.py:1,3,4,5", "common/global_constants.py:825,826,966"]
  notes: Purpose-built retrieval-depth probe. Expect this to be the weakest item.
  evidence_paths: ["**/common/redis_keys.py", "**/common/global_constants.py"]

- id: kv-namespaced-family
  status: grounded
  scope_class: K1
  band: B3
  question: "Where do I adjust what counts as a long break in the command centre?"
  expect:
    admin_page: "Configs"
    key_name: "command_center.long_break_threshold_minutes"
    must_mention:
