# CodeAtlas - PM admin-config eval set
# Service: frodo (riderappcontent), Django admin at /riderappcontent/
#
# PROVENANCE (two independent sources, deliberately)
#   Admin surface : live staging admin. Schema from unbound ADD forms; key
#                   names from the two key-value changelists (RMS.config 194
#                   rows, rider_app.configparams 17). No values, no records.
#   Code truth    : frodo repo @ 0bb7d9f32, read by a separate agent session,
#                   with file:line citations recorded per item.
#
#   These disagree more often than expected. Where they do, the disagreement
#   IS the eval item: the admin shows an editable control, the code ignores it.
#   Items marked admin_vs_code are that class and are the highest value here.
#
# EXTRACTION CAVEAT (learned the hard way)
#   Two items in the first draft had WRONG gold because the HTML scrape was
#   read too literally: a hidden input behind a JS upload widget looked like a
#   missing field, and a DateField rendering as type=text looked like an
#   unvalidated string. Never promote an admin-only inference to gold without
#   a code check.
#
# GRADING
#   evidence_paths   -> retrieval recall, scored from the tool trace, no judge
#   must_not_contain -> regex, no judge
#   expect.*         -> one binary assertion each, judged
#   3 reps per item; report pass rate, not pass/fail

meta:
  repo: frodo
  source_commit: 0bb7d9f32
  admin_root: /riderappcontent/
  audience: product_team
  caches_bypassed: [session, repo, audience_evidence]
  run_matrix:
    - {name: fresh,  audience_cache: off}
    - {name: cached, audience_cache: on}

items:

# =================================================================
# admin_vs_code - the admin lies. Highest-value class.
# =================================================================

- id: kv-dead-disabled-keys
  status: grounded
  scope_class: K1
  kind: admin_vs_code
  band: B2
  priority: critical
  question: "Which cities have the shirt inventory deduction switched off?"
  expect:
    answer: >-
      the *_disbaled_city_ids config keys are not read by any code in this
      service; editing them has no effect
    must_mention:
      - the keys exist in the admin but have zero Python references
      - they survive only as rows in a test fixture
    must_not: explain how to edit the key as though it worked
  retrieval_difficulty: >-
    the key misspells "disabled" as "disbaled" (all 12 of them), so a
    correctly-spelled search finds nothing
  gold_citations:
    - RiderManagement/test_db_setup/frodo_db_schema_dump.sql:1377-1395
    - "dropped in commit a7e625137 (removed RMS)"
  notes: >-
    The single best item in the set. Tests typo-tolerant retrieval AND the
    much harder judgement that a visible, editable admin row is dead code.
    A confidently helpful "edit this key" answer is the expensive failure.
  evidence_paths: []

- id: s3-deactivate-does-not-disable
  status: grounded
  scope_class: S3
  kind: admin_vs_code
  band: B3
  priority: critical
  question: >-
    I unticked "is active" on the platform usage fee row for a city and
    riders are still being charged. Why?
  expect:
    answer: >-
      the lookup falls through to a global default when no active city row
      exists, and that default still satisfies the caller's charge condition
    must_mention:
      - there is a fallback chain, not a single row
      - the default path returns a sentinel id of -1 which passes the gate
      - turning the fee off requires the default config to be absent too
    must_not: attribute it to caching alone
  gold_citations:
    - RMS/helper.py:1974-2013
    - RMS/helper.py:1957-1972
    - RMS/tasks.py:1214-1215
  evidence_paths: ["**/RMS/helper.py", "**/RMS/tasks.py"]

- id: s3-cache-ignores-is-active
  status: grounded
  scope_class: S3
  kind: admin_vs_code
  band: B3
  priority: critical
  question: >-
    Two rows exist for the same city and fee, one active and one inactive.
    Which amount do riders actually get charged?
  expect:
    answer: whichever row was saved most recently, active or not, for up to 24h
    must_mention:
      - the cache key does not include the active flag
      - saving the inactive row overwrites the cached amount
      - the database filter on active is bypassed while the cache is warm
    should_mention: >-
      editing a row in the admin is exactly the action that triggers this,
      since the key fields are read-only and only the flag can be changed
    must_not: answer "the active one" on the basis of the database constraint
  gold_citations:
    - common/redis_keys.py:91
    - RMS/models.py:4150-4157
    - RMS/models.py:3700-3701
    - RMS/admin.py:1660-1664
  notes: >-
    The DB has unique_together including is_active, so "the active one" is
    the defensible-sounding answer and it is wrong in practice.
  evidence_paths: ["**/common/redis_keys.py", "**/RMS/models.py", "**/RMS/admin.py"]

- id: kv-configparams-no-db-fallback
  status: grounded
  scope_class: K1
  kind: admin_vs_code
  band: B3
  priority: high
  question: >-
    I changed a value under Config params but the app is still using
    the old one. What is going on?
  expect:
    must_mention:
      - that table is pushed to cache on save and is never read from the
        database at runtime
      - a row untouched since the last cache flush is invisible to the app
      - re-saving the row in the admin republishes it
    should_mention: the sibling table does have a database fallback, this one does not
    must_not: describe a timed cache expiry as the cause
  gold_citations:
    - rider_app/models.py:599-602
    - slot/slot_redis_helper.py:53-60
    - common/redis_helper.py:250-269
  evidence_paths: ["**/rider_app/models.py", "**/slot/slot_redis_helper.py", "**/common/redis_helper.py"]

- id: rsc-filters-invalid-example
  status: grounded
  scope_class: S3b
  kind: admin_vs_code
  band: B2
  priority: high
  question: "How do I apply a referral surge to specific clients?"
  expect:
    answer: 'enter {"clients": [1,2,3]} with double quotes'
    must_mention:
      - clients are numeric ids
      - the example shown on the form uses single quotes and will be rejected
    must_not: repeat the form's single-quoted example as usable
  gold_citations:
    - rider_app/models.py:83
    - RMS/admin.py:390-429
  notes: >-
    The field's own help_text documents an invalid value. Tests whether the
    answer is copied from the admin or verified against the parser.
  evidence_paths: ["**/rider_app/models.py", "**/RMS/admin.py"]

