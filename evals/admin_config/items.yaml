      - the unit is minutes
  must_not_contain: [".py", "line "]
  evidence_paths: ["**/RMS/**"]

- id: kv-mechanism-generic
  status: grounded
  scope_class: K1
  band: B2
  question: "Where do the rider app's tunable settings live, and how do I change one?"
  expect:
    admin_page: "Configs"
    mechanism: key-value table - find the row by name, then edit the value
    must_mention:
      - the value is free text with no validation on the form
      - there are two separate key-value tables that behave differently
  must_not_contain: [".py", "line "]
  evidence_paths: ["**/RMS/**", "**/rider_app/**"]

- id: kv-type-mismatch
  status: grounded
  scope_class: K1
  band: B3
  question: >-
    Someone changed a setting in the admin and the app started crashing.
    What could have gone wrong?
  expect:
    must_mention:
      - values are free text, unvalidated at the form level
      - configs declare a type separately from the value
      - a value not matching its declared type is the likely cause
  evidence_paths: ["**/RMS/**"]

- id: kv-nonexistent-abstain
  kind: abstention
  status: grounded
  scope_class: K1
  band: B4
  priority: high
  question: "How do I change the geofence radius for a specific client?"
  expect:
    verdict: not_found
    must_say: no geofence or radius setting exists in this service
    must_not: map the question onto an unrelated city, zone or area setting
  notes: True negative. Tests abstention under pressure to be helpful.
  evidence_paths: []

