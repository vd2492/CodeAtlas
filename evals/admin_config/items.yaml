- id: rsc-documented-but-dead
  status: grounded
  scope_class: S3b
  kind: admin_vs_code
  band: B2
  priority: high
  question: >-
    I set a referral surge for a group and also for a subclient inside
    that group. Which one applies?
  expect:
    documented_answer: the subclient takes precedence, per the field's own help text
    actual_answer: >-
      neither - this config is not consumed by any live code path, so the
      surge does not apply at all
    must_mention: both the documented rule and that it is not wired up
    must_not: give the documented precedence rule as the whole answer
  gold_citations: ["rider_app/helper.py:1285"]
  notes: >-
    The hardest item here. help_text states a clear rule, so the documented
    answer is easy and incomplete. Rewards reading call sites over docs.
  evidence_paths: ["**/rider_app/helper.py"]

