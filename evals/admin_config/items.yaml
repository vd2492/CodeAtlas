  scope_class: C
  kind: admin_vs_code
  band: B3
  question: >-
    I replaced a carousel image and it updated for some riders but not
    others. Why?
  expect:
    answer: >-
      the two onboarding variants are cached separately but only one cache
      entry is cleared on save, so the other serves a stale image for up to
      an hour
    must_mention: the optimised variant is the one that goes stale
  gold_citations: ["rider_app/models.py:54-57"]
  evidence_paths: ["**/rider_app/models.py"]

- id: c-notice-end-date
  status: grounded
  scope_class: C
  band: B2
