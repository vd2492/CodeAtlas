  expect:
    answer: a date such as YYYY-MM-DD, validated by the form
    must_mention:
      - a malformed date is rejected on save and never reaches the database
      - leaving it blank means the notice never expires
    should_mention: the end date is inclusive, so the notice shows on that day
    must_not: describe it as an unvalidated free-text field
  gold_citations: ["rider_app/models.py:380", "rider_app/helper.py:1653-1655"]
  notes: >-
    CORRECTED. Drafted as "format undocumented" because the widget renders as
    a text input. It is a real DateField with standard validation.
  evidence_paths: ["**/rider_app/models.py", "**/rider_app/helper.py"]

